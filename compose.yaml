services:
  api:
    build:
      context: ./backend
      target: dev
    env_file:
      - ./backend/.env
    environment:
      APP_DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - api_data:/app/data

  web:
    build:
      context: ./frontend
      target: dev
      args:
        VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  api_data: