services:
  api:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_DATA_DIR: /app/data
      DATABASE_URL: sqlite:///./galaxia.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - api_data:/app/data
      - ./backend/tests:/app/tests
    networks:
      - app_internal

  web:
    build:
      context: ./frontend
      target: dev
      args:
        VITE_API_URL: /api
    depends_on:
      - api
    environment:
      VITE_API_URL: /api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_internal

volumes:
  api_data:

networks:
  app_internal:
    driver: bridge